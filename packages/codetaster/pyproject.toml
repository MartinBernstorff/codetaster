[project]
name = "codetaster"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["codetaster-lib", "typer>=0.20", "pydantic>=2.12", "safe-result>=4.0.3"]

[project.scripts]
codetaster = "codetaster.delivery.console.app:app"

[tool.uv.sources]
codetaster-lib = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
