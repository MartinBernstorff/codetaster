[project]
name = "codetaster-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "codetaster",
  "codetaster-lib",
  "codetaster-cli",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "lefthook>=2.1.16",
    "noprim>=0.4.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "tach>=0.35.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
codetaster = { workspace = true }
codetaster-lib = { workspace = true }
codetaster-cli = { workspace = true }
