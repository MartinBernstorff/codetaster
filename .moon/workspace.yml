$schema: 'https://moonrepo.dev/schemas/workspace.json'

# The Python packages form a single root project: tach, pyrefly and noprim check
# across package boundaries, so they cannot be split per package. The vendored
# VS Code extension is its own project.
projects:
  codetaster: '.'
  vscode-extension: 'vscode-extension'

vcs:
  defaultBranch: 'main'
  provider: 'github'
