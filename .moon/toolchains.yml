$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# Versions are inherited from .prototools (versionFromPrototools defaults to true).
unstable_python:
  packageManager: 'uv'
  venvName: '.venv'

unstable_uv:
  syncArgs: ['--locked']

# The vendored VS Code extension in vscode-extension/. Versions come from .prototools.
# Its `install` task installs dependencies instead of moon: moon runs `npm install`,
# which rewrites upstream's package-lock.json.
javascript:
  packageManager: 'npm'
  installDependencies: false
  # Leave upstream's package.json alone.
  syncPackageManagerField: false

node: {}

npm: {}
